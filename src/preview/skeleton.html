<!DOCTYPE html>
<html data-theme="{{theme}}">
  <head>
    <style>
      html,
      body,
      #root {
        height: 100%;
        width: 99%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        min-height: 200px;
      }

      #root {
        box-sizing: border-box;
        padding: var(--space-smallest);
      }
    </style>
    <link rel="stylesheet" href="{{fontsUrl}}" />
    <link rel="stylesheet" href="{{stylesUrl}}" />
    <link rel="stylesheet" href="{{foundationUrl}}" />
    <link rel="stylesheet" href="{{darkModeUrl}}" />
  </head>
  <body style="background-color: transparent">
    <script type="importmap">
      { "imports": { "@jobber/components": "/editorBundle.js" } }
    </script>
    <div id="root"></div>
    <script>
      var root;
      var rootElement;

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const { type, code, theme } = event.data;
        if (type === "updateCode") {
          const root = document.getElementById("root");
          root.querySelectorAll('script[data-atlantis="live"]').forEach((node) => node.remove());
          const script = document.createElement("script");
          script.type = "module";
          script.setAttribute("data-atlantis", "live");
          script.textContent = code;
          root.appendChild(script);
        } else if (type === "updateTheme") {
          document.documentElement.dataset.theme = theme;
        }
      });
    </script>
    {{overlayFrameGuest}}
  </body>
</html>
